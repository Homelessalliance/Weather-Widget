<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

/* LOGO */
.logo {
  position: absolute;
  top: 20px;
  left: 30px;
  width: 160px;
}

/* Layout */
.container {
  display: flex;
  height: 100vh;
}

.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}

/* Weather */
.city { font-size: 40px; opacity: 0.8; }

/* ✅ moved current conditions */
.desc {
  font-size: 28px;
  margin-top: 10px;
  opacity: 0.9;
}

.current-icon {
  font-size: 75px;
}

.temp {
  font-size: 140px;
  font-weight: bold;
  margin-top: 10px;
}

/* Forecast */
.forecast {
  display: flex;
  gap: 30px;
  margin-top: 50px;
}

.forecast-day {
  text-align: center;
  font-size: 22px;
}

.icon {
  font-size: 26px;
}

/* Clock */
.clock { font-size: 48px; font-weight: bold; }
.date { font-size: 28px; opacity: 0.8; }

/* Notice */
.notice {
  font-size: 32px;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">

<div class="container">

  <!-- LEFT -->
  <div class="weather">

    <div class="city">Oklahoma City</div>

    <!-- ✅ moved here -->
    <div class="desc">Current Conditions</div>

    <div style="display:flex; align-items:center; gap:25px;">
      <div id="icon" class="current-icon">☀️</div>
      <div id="temp" class="temp">--°F</div>
    </div>

    <div id="forecast" class="forecast"></div>

  </div>

  <!-- RIGHT -->
  <div class="side">

    <div>
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>

    <div class="notice">
      <div>Welcome to the Homeless Alliance</div>

      <div style="height:20px;"></div>

      <div style="color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>

  </div>

</div>

<script>

/* ✅ Improved icon logic (includes storms) */
function getIcon(code) {
  if (code === 0) return "☀️";              // clear
  if (code <= 3) return "🌤️";               // partly cloudy
  if (code <= 48) return "☁️";              // cloudy
  if (code <= 67) return "🌧️";              // rain
  if (code <= 77) return "🌨️";              // snow
  if (code <= 82) return "🌧️";              // heavier rain
  if (code <= 99) return "⛈️";              // thunderstorms ✅
  return "🌤️";
}

/* ✅ temp color */
function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

/* WEATHER */
async function loadWeather() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    let c = data.current_weather.temperature;
    let f = Math.round((c * 9/5) + 32);

    const tempEl = document.getElementById("temp");
    tempEl.innerText = f + "°F";
    tempEl.style.color = getTempColor(f);

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    /* ✅ Forecast with HIGH / LOW */
    let html = "";

    data.daily.time.slice(0,5).forEach((day, i) => {

      let highF = Math.round((data.daily.temperature_2m_max[i] * 9/5) + 32);
      let lowF  = Math.round((data.daily.temperature_2m_min[i] * 9/5) + 32);

      let icon = getIcon(data.daily.weathercode[i]);

      let label = new Date(day).toLocaleDateString([], { weekday: 'short' });

      let color = getTempColor(highF);

      html += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${icon}</div>
          <div style="color:${color}; font-weight:bold;">
            ${highF}° / ${lowF}°
          </div>
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = html;

  } catch (e) {
    document.getElementById("temp").innerText = "72°F";
  }
}

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
``
