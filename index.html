<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

/* LOGO */
.logo {
  position: absolute;
  top: 20px;
  right: 30px;
  width: 100px;
}

/* Layout */
.container {
  display: flex;
  height: 100vh;
}

.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}

/* Weather */
.city { font-size: 40px; opacity: 0.8; }

.temp { font-size: 140px; font-weight: bold; }

.desc { font-size: 36px; margin-top: 10px; }

.details { font-size: 24px; opacity: 0.8; }

/* Forecast row */
.forecast {
  display: flex;
  gap: 20px;
  margin-top: 40px;
}

.forecast-day {
  text-align: center;
  font-size: 20px;
}

.icon {
  font-size: 28px;
}

/* Clock */
.clock { font-size: 48px; font-weight: bold; }

.date { font-size: 28px; opacity: 0.8; }

.notice { font-size: 32px; }

</style>
</head>

<body>

<img src="logo.png" class="logo">

<div class="container">

  <div class="weather">
    <div class="city">Oklahoma City</div>

    <div style="display:flex; align-items:center; gap:20px;">
      <div id="icon" class="icon">☀️</div>
      <div id="temp" class="temp">--°F</div>
    </div>

    <div id="desc" class="desc">Loading...</div>
    <div id="details" class="details"></div>

    <div id="forecast" class="forecast"></div>
  </div>

  <div class="side">
    <div>
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>

    <div class="notice">
      Welcome to the Homeless Alliance<br>
      Please check in at the front desk
    </div>
  </div>

</div>

<script>

/* WEATHER ICON MAP */
function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 3) return "🌤️";
  if (code <= 48) return "☁️";
  if (code <= 67) return "🌧️";
  if (code <= 77) return "🌨️";
  if (code <= 82) return "🌦️";
  return "🌡️";
}

/* WEATHER */
async function loadWeather() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,weathercode&current_weather=true&timezone=auto"
    );
    const data = await res.json();

    let c = data.current_weather.temperature;
    let f = (c * 9/5) + 32;

    document.getElementById("temp").innerText = Math.round(f) + "°F";
    document.getElementById("desc").innerText = "Current Conditions";

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    /* FORECAST */
    let forecastHTML = "";

    data.daily.time.slice(0,5).forEach((day, i) => {
      let tempC = data.daily.temperature_2m_max[i];
      let tempF = Math.round((tempC * 9/5) + 32);
      let icon = getIcon(data.daily.weathercode[i]);

      let d = new Date(day);
      let label = d.toLocaleDateString([], { weekday: 'short' });

      forecastHTML += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${icon}</div>
          <div>${tempF}°</div>
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = forecastHTML;

  } catch (e) {
    document.getElementById("temp").innerText = "72°F";
    document.getElementById("desc").innerText = "Weather unavailable";
  }
}

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
