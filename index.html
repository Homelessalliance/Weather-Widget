<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

.logo {
  position: absolute;
  top: 20px;
  left: 30px;
  width: 160px;
}

.container {
  display: flex;
  height: 100vh;
}

.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}

.city { font-size: 40px; opacity: 0.8; }

.desc {
  font-size: 28px;
  margin-top: 10px;
  opacity: 0.9;
}

.current-icon { font-size: 75px; }

.temp {
  font-size: 140px;
  font-weight: bold;
  margin-top: 10px;
}

.wind {
  font-size: 24px;
  margin-top: 10px;
  opacity: 0.8;
}

.forecast {
  display: flex;
  gap: 30px;
  margin-top: 50px;
}

.forecast-day {
  text-align: center;
  font-size: 22px;
  min-width: 90px;
}

.icon { font-size: 26px; }

.rain {
  font-size: 18px;
  margin-top: 5px;
}

.clock { font-size: 48px; font-weight: bold; }
.date { font-size: 28px; opacity: 0.8; }

.notice { font-size: 32px; }
</style>
</head>

<body>

<img src="logo.png" class="logo">

<div class="container">

  <div class="weather">

    <div class="city">Oklahoma City</div>
    <div class="desc">Current Conditions</div>

    <div style="display:flex; align-items:center; gap:25px;">
      <div id="icon" class="current-icon">☀️</div>
      <div id="temp" class="temp">--°F</div>
    </div>

    <div id="wind" class="wind"></div>

    <div id="forecast" class="forecast"></div>

  </div>

  <div class="side">

    <div>
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>

    <div class="notice">
      <div>Welcome to the Homeless Alliance</div>

      <div style="height:20px;"></div>

      <div style="color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>

  </div>

</div>

<script>

/* ✅ ICON BASE LOGIC */
function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 45) return "☁️";

  if (code >= 51 && code <= 67) return "🌧️";
  if (code >= 71 && code <= 77) return "🌨️";

  if (code >= 95) return "⛈️";

  return "🌤️";
}

function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

async function loadWeather() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    let f = Math.round((data.current_weather.temperature * 9/5) + 32);

    const tempEl = document.getElementById("temp");
    tempEl.innerText = f + "°F";
    tempEl.style.color = getTempColor(f);

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    document.getElementById("wind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    let html = "";

    data.daily.time.slice(0,5).forEach((day, i) => {

      let baseCode = data.daily.weathercode[i];
      let rain = data.daily.precipitation_probability_max[i];

      let icon = getIcon(baseCode);

      /* ✅ FINAL FIX — prevent false storms */
      if (baseCode >= 95 && rain < 25) {
        icon = rain > 10 ? "🌧️" : "☁️";
      }

      let high = Math.round((data.daily.temperature_2m_max[i] * 9/5) + 32);
      let low  = Math.round((data.daily.temperature_2m_min[i] * 9/5) + 32);

      let label = new Date(day).toLocaleDateString([], { weekday: 'short' });
      let color = getTempColor(high);

      /* ✅ CLEAN rain display */
      let rainDisplay = rain >= 15
        ? `<div class="rain" style="color:#7fc8f8;">${rain}%</div>`
        : "";

      html += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${icon}</div>
          <div>
            <span style="color:${color}; font-weight:bold;">${high}°</span>
            <span style="opacity:0.7;"> / ${low}°</span>
          </div>
          ${rainDisplay}
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = html;

  } catch (e) {
    document.getElementById("temp").innerText = "--°F";
  }
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
``
