<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
 margin: 0;
 background: #0b1e3c;
 color: white;
 font-family: Arial, sans-serif;
}

/* ✅ Always visible immediately */
#fallback {
 display: flex;
 align-items: center;
 justify-content: center;
 height: 100vh;
 font-size: 42px;
}

/* Hide app until ready */
#app {
 display: none;
}

.container {
 display: flex;
 height: 100vh;
}

/* LEFT */
.weather {
 flex: 2;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
}

.city { font-size: 50px; }
.desc { font-size: 28px; margin-top: 8px; }

.current-row {
 display: flex;
 align-items: center;
 gap: 30px;
 margin-top: 30px;
}

/* ✅ REMOVED FILTER (important) */
.current-icon img {
 width: 80px;
 height: 80px;
}

.temp {
 font-size: 160px;
 font-weight: bold;
}

.wind {
 margin-top: 10px;
 font-size: 26px;
 opacity: 0.85;
}

/* FORECAST */
.forecast {
 display: flex;
 gap: 60px;
 margin-top: 70px;
}

.forecast-day {
 text-align: center;
 font-size: 28px;
 min-width: 110px;
 padding: 12px;
 border-radius: 12px;
}

.forecast-day.today {
 background: rgba(255,255,255,0.08);
 border: 2px solid #7fc8f8;
 transform: scale(1.05);
}

/* ✅ REMOVED FILTER */
.icon img {
 width: 40px;
 height: 40px;
}

.rain {
 font-size: 22px;
 color: #7fc8f8;
}

/* RIGHT */
.side {
 flex: 1;
 background: #132f5e;
 display: flex;
 flex-direction: column;
 padding: 55px 40px 40px 40px;
}

.side-top {
 text-align: center;
 padding-top: 20px;
}

.clock { font-size: 64px; font-weight: bold; }
.date { font-size: 34px; opacity: 0.9; }

.side-middle {
 flex: 1;
 display: flex;
 align-items: center;
 justify-content: center;
}

.logo { width: 250px; }

.notice { font-size: 32px; }

</style>
</head>

<body>

<!-- ✅ Visible immediately -->
<div id="fallback">Loading weather...</div>

<!-- ✅ Real app -->
<div id="app">

<div class="container">

<div class="weather">
<div class="city">Oklahoma City</div>
<div class="desc">Current Conditions</div>

<div class="current-row">
<div id="icon" class="current-icon"></div>
<div id="temp" class="temp">Loading...</div>
</div>

<div id="wind" class="wind"></div>
<div id="forecast" class="forecast"></div>
</div>

<div class="side">
<div class="side-top">
<div id="clock" class="clock"></div>
<div id="date" class="date"></div>
</div>

<div class="side-middle">
<img src="logo.png" class="logo">
</div>

<div class="notice">
<div>Welcome to the Homeless Alliance</div>
<div style="margin-top:20px; color:#ffd166; font-weight:bold;">
Day Shelter Hours: 7:00 AM - 3:00 PM
</div>
</div>
</div>

</div>
</div>

<script>

const DISPLAY_TZ = "America/Chicago";

function showApp() {
 document.getElementById("fallback").style.display = "none";
 document.getElementById("app").style.display = "block";
}

function getIconFile(code) {
 if (code === 0) return "Sun.svg";
 if (code <= 2) return "Cloud.svg";
 if (code <= 45) return "Cloud.svg";
 if (code >= 51 && code <= 67) return "Rain.svg";
 if (code >= 95) return "Storm.svg";
 return "Cloud.svg";
}

function getTempColor(tempF) {
 if (tempF < 50) return "#4cc9f0";
 if (tempF < 70) return "#ffffff";
 if (tempF < 85) return "#ffd166";
 return "#ff6b6b";
}

async function loadWeather() {
 try {

  const res = await fetch(
   "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
  );

  const data = await res.json();

  const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

  document.getElementById("temp").innerText = tempF + "°F";
  document.getElementById("temp").style.color = getTempColor(tempF);

  document.getElementById("icon").innerHTML =
    '<img src="' + getIconFile(data.current_weather.weathercode) + '">';

  document.getElementById("wind").innerText =
    "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

  // ✅ Delay forecast rendering slightly (helps stability)
  setTimeout(() => {
    buildForecast(data);
  }, 300);

  showApp();

 } catch (e) {
  showApp();
 }
}

function buildForecast(data) {
 var html = "";

 for (var i = 0; i < 5; i++) {
   var high = Math.round((data.daily.temperature_2m_max[i]*9/5)+32);
   var low  = Math.round((data.daily.temperature_2m_min[i]*9/5)+32);

   html += '<div class="forecast-day">';
   html += '<div>Day</div>';
   html += '<div class="icon"><img srcg</div>';
   html += '<div><span style="color:#ffd166;">' + high + '°</span> / ' + low + '°</div>';
   html += '</div>';
 }

 document.getElementById("forecast").innerHTML = html;
}

function updateClock() {
 const now = new Date();

 document.getElementById("clock").innerText =
  now.toLocaleTimeString([], {
   timeZone: DISPLAY_TZ,
   hour: "2-digit",
   minute: "2-digit"
  });

 document.getElementById("date").innerText =
  now.toLocaleDateString([], {
   timeZone: DISPLAY_TZ,
   weekday: "long",
   month: "long",
   day: "numeric"
  });
}

/* ✅ Give browser time to stabilize */
setTimeout(() => {
 loadWeather();
}, 1500);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
``
