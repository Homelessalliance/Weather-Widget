<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather</title>

<style>
body {
 margin: 0;
 background: #0b1e3c;
 color: white;
 font-family: Arial, sans-serif;
}

#fallback {
 display: flex;
 align-items: center;
 justify-content: center;
 height: 100vh;
 font-size: 42px;
}

#app {
 display: none;
}

.container {
 display: flex;
 height: 100vh;
}

.weather {
 flex: 1;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
}

.city { font-size: 50px; }
.desc { font-size: 28px; margin-top: 8px; }

.current-row {
 display: flex;
 align-items: center;
 gap: 30px;
 margin-top: 30px;
}

/* ✅ KEEP WHITE ICON FIX */
.current-icon img {
 width: 80px;
 height: 80px;
 filter: brightness(0) invert(1);
}

.temp {
 font-size: 160px;
 font-weight: bold;
}

.wind {
 margin-top: 10px;
 font-size: 26px;
 opacity: 0.85;
}

.forecast {
 display: flex;
 gap: 60px;
 margin-top: 70px;
}

.forecast-day {
 text-align: center;
 font-size: 28px;
 min-width: 110px;
 padding: 12px;
 border-radius: 12px;
}

.forecast-day.today {
 background: rgba(255,255,255,0.08);
 border: 2px solid #7fc8f8;
 transform: scale(1.05);
}

/* ✅ KEEP WHITE ICON FIX */
.icon img {
 width: 40px;
 height: 40px;
 filter: brightness(0) invert(1);
}

.rain {
 font-size: 22px;
 color: #7fc8f8;
}
</style>
</head>

<body>

<div id="fallback">Loading weather...</div>

<div id="app">
 <div class="container">
  <div class="weather">
   <div class="city">Oklahoma City</div>
   <div class="desc">Current Conditions</div>

   <div class="current-row">
    <div id="icon" class="current-icon"></div>
    <div id="temp" class="temp">--°F</div>
   </div>

   <div id="wind" class="wind"></div>
   <div id="forecast" class="forecast"></div>
  </div>
 </div>
</div>

<script>

const DISPLAY_TZ = "America/Chicago";

function showApp() {
 document.getElementById("fallback").style.display = "none";
 document.getElementById("app").style.display = "block";
}

/* ✅ SIMPLE + GOOGLE-LIKE LOGIC (FINAL) */
function getIconFile(code, rainChance) {

 // ✅ Very dry → Sun
 if (rainChance <= 10) {
   return "Sun.svg";
 }

 // ✅ Light chance → Partly Cloudy (fixes Tue/Wed)
 if (rainChance > 10 && rainChance <= 30) {
   return "PartlyCloud.svg";
 }

 // ✅ Medium chance → Rain (fixes Thu/Fri)
 if (rainChance > 30 && rainChance <= 60) {
   return "Rain.svg";
 }

 // ✅ High chance → Storm
 if (rainChance > 60) {
   return "Storm.svg";
 }

 return "Cloud.svg";
}

function getTempColor(tempF) {
 if (tempF < 70) return "#4cc9f0";
 if (tempF < 90) return "#ff9f43";
 return "#ff3b3b";
}

function getTodayKey() {
 const parts = new Intl.DateTimeFormat("en-CA", {
  timeZone: DISPLAY_TZ,
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
 }).formatToParts(new Date());

 return parts.find(p=>p.type==="year").value + "-" +
        parts.find(p=>p.type==="month").value + "-" +
        parts.find(p=>p.type==="day").value;
}

function getWeekday(dateStr) {
 const d = new Date(dateStr + "T12:00:00");
 return new Intl.DateTimeFormat("en-US", {
  weekday: "short",
  timeZone: DISPLAY_TZ
 }).format(d);
}

async function loadWeather() {
 try {
  const res = await fetch(
   "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
  );

  const data = await res.json();

  const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

  document.getElementById("temp").innerText = tempF + "°F";
  document.getElementById("temp").style.color = getTempColor(tempF);

  const todayKey = getTodayKey();
  let startIndex = data.daily.time.indexOf(todayKey);
  if (startIndex < 0) startIndex = 0;

  const currentRain = data.daily.precipitation_probability_max[startIndex];

  document.getElementById("icon").innerHTML =
    '<img src="' + getIconFile(data.current_weather.weathercode, currentRain) + '">';

  document.getElementById("wind").innerText =
    "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

  let html = "";

  for (let i = startIndex; i < startIndex + 5; i++) {

   let code = data.daily.weathercode[i];
   let rain = data.daily.precipitation_probability_max[i];

   let file = getIconFile(code, rain);

   let high = Math.round((data.daily.temperature_2m_max[i]*9/5)+32);
   let low  = Math.round((data.daily.temperature_2m_min[i]*9/5)+32);

   let label = getWeekday(data.daily.time[i]);

   html += '<div class="forecast-day ' + (i === startIndex ? 'today' : '') + '">';
   html += '<div>' + label + '</div>';
   html += '<div class="icon"><img src="' + file + '"></div>';
   html += '<div><span style="color:#ffd166;">' + high + '°</span> / ' + low + '°</div>';
   html += '<div class="rain">' + rain + '%</div>';
   html += '</div>';
  }

  document.getElementById("forecast").innerHTML = html;

  showApp();

 } catch (e) {
  showApp();
 }
}

setTimeout(loadWeather, 1200);
setInterval(loadWeather, 600000);

</script>

</body>
</html>
