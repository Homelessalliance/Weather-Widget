<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

/* ✅ LEFT SIDE (bigger + more readable) */
.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.city {
  font-size: 52px;
  opacity: 0.85;
}

.desc {
  font-size: 32px;
  margin-top: 10px;
}

.current-icon {
  font-size: 95px;
}

.temp {
  font-size: 180px;
  font-weight: bold;
  margin-top: 10px;
}

.wind {
  font-size: 28px;
  margin-top: 12px;
  opacity: 0.85;
}

/* ✅ bigger forecast */
.forecast {
  display: flex;
  gap: 65px;
  margin-top: 80px;
}

.forecast-day {
  text-align: center;
  font-size: 32px;
  min-width: 110px;
}

.icon {
  font-size: 38px;
}

.rain {
  font-size: 22px;
  margin-top: 8px;
}

/* ✅ RIGHT SIDE */
.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}

/* time */
.clock {
  font-size: 56px;
  font-weight: bold;
}

.date {
  font-size: 32px;
  opacity: 0.85;
}

/* ✅ LOGO (now properly placed) */
.logo {
  width: 200px;
  margin: 30px auto 0 auto;
  display: block;
}

/* notice */
.notice {
  font-size: 34px;
}

</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="weather">

    <div class="city">Oklahoma City</div>
    <div class="desc">Current Conditions</div>

    <div style="display:flex; align-items:center; gap:30px;">
      <div id="icon" class="current-icon">☀️</div>
      <div id="temp" class="temp">--°F</div>
    </div>

    <div id="wind" class="wind"></div>

    <div id="forecast" class="forecast"></div>

  </div>

  <!-- RIGHT -->
  <div class="side">

    <div>
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>

      <!-- ✅ LOGO MOVED HERE -->
      <img src="logo.png" class="logo">
    </div>

    <div class="notice">
      <div>Welcome to the Homeless Alliance</div>

      <div style="height:20px;"></div>

      <div style="color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>

  </div>

</div>

<script>

function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 45) return "☁️";
  if (code >= 51 && code <= 67) return "☁️💧";
  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 95) return "☁️⚡";
  return "🌤️";
}

function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

async function loadWeather() {
  try {

    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    let f = Math.round((data.current_weather.temperature * 9/5) + 32);

    document.getElementById("temp").innerText = f + "°F";
    document.getElementById("temp").style.color = getTempColor(f);

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    document.getElementById("wind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    let html = "";

    data.daily.time.slice(1,6).forEach((day, i) => {

      let code = data.daily.weathercode[i+1];
      let rain = data.daily.precipitation_probability_max[i+1];

      let icon = getIcon(code);

      if (code >= 95 && rain < 25) {
        icon = rain > 10 ? "☁️💧" : "☁️";
      }

      let high = Math.round((data.daily.temperature_2m_max[i+1] * 9/5) + 32);
      let low  = Math.round((data.daily.temperature_2m_min[i+1] * 9/5) + 32);

      let label = new Date(day).toLocaleDateString([], { weekday: 'short' });

      let rainDisplay = `
        <div class="rain" style="color:${rain >= 15 ? '#7fc8f8' : 'rgba(255,255,255,0.5)'};">
          ${rain}%
        </div>
      `;

      html += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${icon}</div>
          <div>
            <span style="color:${getTempColor(high)}; font-weight:bold;">${high}°</span>
            <span style="opacity:0.7;"> / ${low}°</span>
          </div>
          ${rainDisplay}
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = html;

  } catch (e) {
    document.getElementById("temp").innerText = "--°F";
  }
}

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
