<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

/* LEFT */
.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ✅ TIME ABOVE CITY */
.clock {
  font-size: 44px;
  font-weight: bold;
}

.date {
  font-size: 24px;
  opacity: 0.85;
  margin-bottom: 10px;
}

.city {
  font-size: 50px;
}

.desc {
  font-size: 28px;
  margin-top: 8px;
}

/* ✅ CURRENT ROW */
.current-row {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-top: 30px;
}

.current-icon {
  font-size: 80px;
}

/* ✅ TODAY (separate from forecast) */
.today {
  text-align: center;
  font-size: 26px;
}

.today high {
  color: #ffd166;
}

.today .rain {
  color: #7fc8f8;
  font-size: 22px;
}

/* BIG TEMP */
.temp {
  font-size: 160px;
  font-weight: bold;
}

.wind {
  margin-top: 10px;
  font-size: 26px;
  opacity: 0.85;
}

/* ✅ FUTURE FORECAST ONLY */
.forecast {
  display: flex;
  gap: 60px;
  margin-top: 70px;
}

.forecast-day {
  text-align: center;
  font-size: 28px;
  min-width: 110px;
}

.icon {
  font-size: 36px;
}

.rain {
  font-size: 22px;
}

/* RIGHT PANEL */
.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}
</style>
</head>

<body>

<div class="container">

  <div class="weather">

    <!-- ✅ MOVED TIME HERE -->
    <div id="clock" class="clock"></div>
    <div id="date" class="date"></div>

    <div class="city">Oklahoma City</div>
    <div class="desc">Current Conditions</div>

    <div class="current-row">

      <div id="icon" class="current-icon">☀️</div>

      <!-- ✅ TODAY CARD -->
      <div id="today" class="today"></div>

      <div id="temp" class="temp">--°F</div>

    </div>

    <div id="wind" class="wind"></div>

    <div id="forecast" class="forecast"></div>

  </div>

  <div class="side">
    <div>logo.png</div>

    <div style="font-size:32px;">
      Welcome to the Homeless Alliance
      <div style="margin-top:20px; color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>
  </div>

</div>

<script>

function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 45) return "☁️";
  if (code >= 51 && code <= 67) return "☁️💧";
  if (code >= 95) return "☁️⚡";
  return "🌤️";
}

function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

async function loadWeather() {
  try {

    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    let tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

    document.getElementById("temp").innerText = tempF + "°F";
    document.getElementById("temp").style.color = getTempColor(tempF);

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    document.getElementById("wind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    /* ✅ TODAY (index 0) */
    let high = Math.round((data.daily.temperature_2m_max[0] * 9/5) + 32);
    let low  = Math.round((data.daily.temperature_2m_min[0] * 9/5) + 32);
    let rain = data.daily.precipitation_probability_max[0];

    document.getElementById("today").innerHTML = `
      <div>Wed</div>
      <div><span style="color:#ffd166;">${high}°</span> / ${low}°</div>
      <div class="rain">${rain}%</div>
    `;

    /* ✅ FORECAST starts at THURSDAY */
    let html = "";

    data.daily.time.slice(1,6).forEach((day, i) => {

      let idx = i + 1;

      let code = data.daily.weathercode[idx];
      let rain = data.daily.precipitation_probability_max[idx];
      let high = Math.round((data.daily.temperature_2m_max[idx] * 9/5) + 32);
      let low  = Math.round((data.daily.temperature_2m_min[idx] * 9/5) + 32);

      let label = new Date(day).toLocaleDateString([], { weekday: 'short' });

      html += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${getIcon(code)}</div>
          <div><span style="color:#ffd166;">${high}°</span> / ${low}°</div>
          <div class="rain">${rain}%</div>
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = html;

  } catch {
    document.getElementById("temp").innerText = "--°F";
  }
}

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);
updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
