<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: flex;  background: #0b1e3c;
  height: 100vh;
}

/* LEFT PANEL */
.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ✅ TIME MOVED LEFT */
.clock {
  font-size: 48px;
  font-weight: bold;
}

.city {
  font-size: 48px;
  margin-top: 10px;
}

.desc {
  font-size: 28px;
  margin-top: 5px;
}

/* ✅ CURRENT ROW */
.current-row {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-top: 20px;
}

.current-icon {
  font-size: 90px;
}

/* ✅ TODAY DETAILS NEXT TO ICON */
.today-details {
  text-align: center;
  font-size: 24px;
  line-height: 1.2;
}

.today-high {
  color: #ffd166;
  font-weight: bold;
}

.today-low {
  opacity: 0.7;
}

.today-rain {
  color: #7fc8f8;
  font-size: 20px;
}

/* big temp */
.temp {
  font-size: 160px;
  font-weight: bold;
}

.wind {
  margin-top: 10px;
  font-size: 26px;
  opacity: 0.85;
}

/* ✅ FUTURE FORECAST */
.forecast {
  display: flex;
  gap: 60px;
  margin-top: 70px;
}

.forecast-day {
  text-align: center;
  font-size: 28px;
  min-width: 110px;
}

.icon {
  font-size: 36px;
}

.rain {
  font-size: 22px;
}

/* RIGHT PANEL */
.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
}

.logo {
  width: 200px;
  margin: 40px auto;
  display: block;
}

.notice {
  font-size: 34px;
}

</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="weather">

    <!-- ✅ TIME MOVED HERE -->
    <div id="clock" class="clock"></div>

    <div class="city">Oklahoma City</div>
    <div class="desc">Current Conditions</div>

    <div class="current-row">

      <div id="icon" class="current-icon">☀️</div>

      <!-- ✅ TODAY DETAILS -->
      <div id="todayDetails" class="today-details"></div>

      <div id="temp" class="temp">--°F</div>

    </div>

    <div id="wind" class="wind"></div>

    <div id="forecast" class="forecast"></div>

  </div>

  <!-- RIGHT -->
  <div class="side">

    <div>
      <img src="logo.png" class="logo">
    </div>

    <div class="notice">
      <div>Welcome to the Homeless Alliance</div>
      <div style="height:20px;"></div>
      <div style="color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>

  </div>

</div>

<script>

function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 45) return "☁️";
  if (code >= 51 && code <= 67) return "☁️💧";
  if (code >= 95) return "☁️⚡";
  return "🌤️";
}

function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

async function loadWeather() {
  try {

    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    let tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

    document.getElementById("temp").innerText = tempF + "°F";
    document.getElementById("temp").style.color = getTempColor(tempF);

    document.getElementById("icon").innerText =
      getIcon(data.current_weather.weathercode);

    document.getElementById("wind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    /* ✅ TODAY DETAILS */
    let high = Math.round((data.daily.temperature_2m_max[0] * 9/5) + 32);
    let low  = Math.round((data.daily.temperature_2m_min[0] * 9/5) + 32);
    let rain = data.daily.precipitation_probability_max[0];

    document.getElementById("todayDetails").innerHTML = `
      <div>Today</div>
      <div>
        <span class="today-high">${high}°</span>
        <span class="today-low"> / ${low}°</span>
      </div>
      <div class="today-rain">${rain}%</div>
    `;

    /* ✅ FUTURE DAYS ONLY (START THURSDAY) */
    let html = "";

    data.daily.time.slice(1,6).forEach((day, i) => {

      let idx = i + 1;

      let code = data.daily.weathercode[idx];
      let rain = data.daily.precipitation_probability_max[idx];
      let high = Math.round((data.daily.temperature_2m_max[idx] * 9/5) + 32);
      let low  = Math.round((data.daily.temperature_2m_min[idx] * 9/5) + 32);

      let label = new Date(day).toLocaleDateString([], { weekday: 'short' });

      html += `
        <div class="forecast-day">
          <div>${label}</div>
          <div class="icon">${getIcon(code)}</div>
          <div>
            <span style="color:#ffd166; font-weight:bold;">${high}°</span>
            <span style="opacity:0.7;"> / ${low}°</span>
          </div>
          <div class="rain">${rain}%</div>
        </div>
      `;
    });

    document.getElementById("forecast").innerHTML = html;

  } catch {
    document.getElementById("temp").innerText = "--°F";
  }
}

/* CLOCK */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

loadWeather();
setInterval(loadWeather, 600000);
updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
  color: white;
  font-family: Arial, sans-serif;
}
