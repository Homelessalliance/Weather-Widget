<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather</title>

<style>
body {
 margin: 0;
 background: #0b1e3c;
 color: white;
 font-family: Arial, sans-serif;
}

/* fallback */
#fallback {
 display: flex;
 align-items: center;
 justify-content: center;
 height: 100vh;
 font-size: 42px;
}

/* hide app until ready */
#app {
 display: none;
}

/* full layout */
.container {
 display: flex;
 height: 100vh;
}

/* weather full screen */
.weather {
 flex: 1;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
}

.city { font-size: 50px; }
.desc { font-size: 28px; margin-top: 8px; }

.current-row {
 display: flex;
 align-items: center;
 gap: 30px;
 margin-top: 30px;
}

/* white icons (safe) */
.current-icon img {
 width: 80px;
 height: 80px;
 filter: invert(1);
}

.temp {
 font-size: 160px;
 font-weight: bold;
}

.wind {
 margin-top: 10px;
 font-size: 26px;
 opacity: 0.85;
}

.forecast {
 display: flex;
 gap: 60px;
 margin-top: 70px;
}

.forecast-day {
 text-align: center;
 font-size: 28px;
 min-width: 110px;
 padding: 12px;
 border-radius: 12px;
}

.forecast-day.today {
 background: rgba(255,255,255,0.08);
 border: 2px solid #7fc8f8;
 transform: scale(1.05);
}

/* white icons */
.icon img {
 width: 40px;
 height: 40px;
 filter: invert(1);
}

.rain {
 font-size: 22px;
 color: #7fc8f8;
}

</style>
</head>

<body>

<div id="fallback">Loading weather...</div>

<div id="app">
  <div class="container">
    <div class="weather">
      <div class="city">Oklahoma City</div>
      <div class="desc">Current Conditions</div>

      <div class="current-row">
        <div id="icon" class="current-icon"></div>
        <div id="temp" class="temp">--°F</div>
      </div>

      <div id="wind" class="wind"></div>
      <div id="forecast" class="forecast"></div>
    </div>
  </div>
</div>

<script>

// show UI once ready
function showApp() {
 document.getElementById("fallback").style.display = "none";
 document.getElementById("app").style.display = "block";
}

// icon mapping
function getIconFile(code) {
 if (code === 0) return "Sun.svg";
 if (code <= 2) return "Cloud.svg";
 if (code <= 45) return "Cloud.svg";
 if (code >= 51 && code <= 67) return "Rain.svg";
 if (code >= 95) return "Storm.svg";
 return "Cloud.svg";
}

// ✅ FINAL TEMP COLOR LOGIC
function getTempColor(tempF) {
 if (tempF < 70) return "#4cc9f0";   // blue (cool)
 if (tempF < 90) return "#ff9f43";   // orange (comfortable/warm)
 return "#ff3b3b";                   // red (hot)
}

async function loadWeather() {
 try {

  const res = await fetch(
   "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
  );

  const data = await res.json();

  const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

  document.getElementById("temp").innerText = tempF + "°F";
  document.getElementById("temp").style.color = getTempColor(tempF);

  document.getElementById("icon").innerHTML =
    '<img src="' + getIconFile(data.current_weather.weathercode) + '">';

  document.getElementById("wind").innerText =
    "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

  var html = "";

  for (var i = 0; i < 5; i++) {

   var code = data.daily.weathercode[i];
   var file = getIconFile(code);

   var rain = data.daily.precipitation_probability_max[i];

   var high = Math.round((data.daily.temperature_2m_max[i]*9/5)+32);
   var low  = Math.round((data.daily.temperature_2m_min[i]*9/5)+32);

   html += '<div class="forecast-day">';
   html += '<div>Day</div>';
   html += '<div class="icon"><img src="' + file + '"></div>';
   html += '<div><span style="color:#ffd166;">' + high + '°</span> / ' + low + '°</div>';
   html += '<div class="rain">' + rain + '%</div>';
   html += '</div>';
  }

  document.getElementById("forecast").innerHTML = html;

  showApp();

 } catch (e) {
  showApp();
 }
}

// delay helps Pi signage not skip
setTimeout(loadWeather, 1200);

// refresh every 10 minutes
setInterval(loadWeather, 600000);

</script>

</body>
</html>
