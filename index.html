<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.city { font-size: 50px; }
.desc { font-size: 28px; margin-top: 8px; }

.current-row {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-top: 30px;
}

.current-icon { font-size: 80px; }
.temp { font-size: 160px; font-weight: bold; }
.wind { margin-top: 10px; font-size: 26px; opacity: 0.85; }

/* FORECAST */
.forecast {
  display: flex;
  gap: 60px;
  margin-top: 70px;
}

.forecast-day {
  text-align: center;
  font-size: 28px;
  min-width: 110px;
  padding: 12px;
  border-radius: 12px;
}

.forecast-day.today {
  background: rgba(255,255,255,0.08);
  border: 2px solid #7fc8f8;
  transform: scale(1.05);
}

.icon { font-size: 36px; }

/* ✅ Rain % blue */
.rain {
  font-size: 22px;
  color: #7fc8f8;
}

/* RIGHT PANEL */
.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  padding: 40px;
}

/* top: centered time/date */
.side-top {
  text-align: center;
}

/* ✅ Larger time/date */
.clock { font-size: 64px; font-weight: bold; }
.date  { font-size: 34px; opacity: 0.9; }

/* middle: logo between top and bottom */
.side-middle {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;

  /* ✅ pushes logo down a bit so it doesn't hug the time/date */
  padding-top: 35px;
  padding-bottom: 35px;
}

/* ✅ Larger logo */
.logo {
  width: 250px;
  display: block;
}

/* bottom: welcome message */
.notice {
  font-size: 32px;
}
</style>
</head>

<body>
<div class="container">

  <!-- LEFT -->
  <div class="weather">
    <div class="city">Oklahoma City</div>
    <div class="desc">Current Conditions</div>

    <div class="current-row">
      <div id="icon" class="current-icon">☀️</div>
      <div id="temp" class="temp">--°F</div>
    </div>

    <div id="wind" class="wind"></div>
    <div id="forecast" class="forecast"></div>
  </div>

  <!-- RIGHT -->
  <div class="side">
    <div class="side-top">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>

    <div class="side-middle">
      <img src="logo.png" class="logo" alt="Homeless Alliance Logo">
    </div>

    <div class="notice">
      <div>Welcome to the Homeless Alliance</div>
      <div style="margin-top:20px; color:#ffd166; font-weight:bold;">
        Day Shelter Hours: 7:00 AM - 3:00 PM
      </div>
    </div>
  </div>

</div>

<script>
const DISPLAY_TZ = "America/Chicago"; // OKC local time

function getIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 45) return "☁️";
  if (code >= 51 && code <= 67) return "☁️💧";
  if (code >= 95) return "☁️⚡";
  return "🌤️";
}

function getTempColor(tempF) {
  if (tempF < 50) return "#4cc9f0";
  if (tempF < 70) return "#ffffff";
  if (tempF < 85) return "#ffd166";
  return "#ff6b6b";
}

/* ✅ Get YYYY-MM-DD in a specific timezone */
function getTodayKeyInTZ(tz) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

/* ✅ Fix weekday label shift: parse date as LOCAL NOON and format in DISPLAY_TZ */
function weekdayFromISO(dateStr, tz) {
  // Using "T12:00:00" prevents UTC-midnight rollback issues
  const safeDate = new Date(dateStr + "T12:00:00");
  return new Intl.DateTimeFormat("en-US", { weekday: "short", timeZone: tz }).format(safeDate);
}

async function loadWeather() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );
    const data = await res.json();

    // Current conditions
    const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);
    document.getElementById("temp").innerText = tempF + "°F";
    document.getElementById("temp").style.color = getTempColor(tempF);
    document.getElementById("icon").innerText = getIcon(data.current_weather.weathercode);
    document.getElementById("wind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    // Forecast starts on real local today
    const todayKey = getTodayKeyInTZ(DISPLAY_TZ);
    let startIndex = data.daily.time.indexOf(todayKey);
    if (startIndex < 0) startIndex = 0;

    let html = "";
    for (let i = startIndex; i < Math.min(startIndex + 5, data.daily.time.length); i++) {
      const code = data.daily.weathercode[i];
      const rain = data.daily.precipitation_probability_max[i];
      const high = Math.round((data.daily.temperature_2m_max[i] * 9/5) + 32);
      const low  = Math.round((data.daily.temperature_2m_min[i] * 9/5) + 32);

      // ✅ Correct weekday label (no more Tue/Wed shift)
      const label = weekdayFromISO(data.daily.time[i], DISPLAY_TZ);

      const className = (i === startIndex) ? "forecast-day today" : "forecast-day";

      html += `
        <div class="${className}">
          <div>${label}</div>
          <div class="icon">${getIcon(code)}</div>
          <div><span style="color:#ffd166;">${high}°</span> / ${low}°</div>
          <div class="rain">${rain}%</div>
        </div>
      `;
    }

    document.getElementById("forecast").innerHTML = html;

  } catch (e) {
    document.getElementById("temp").innerText = "--°F";
  }
}

/* Clock/date centered in right column, forced to OKC timezone */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { timeZone: DISPLAY_TZ, hour: "2-digit", minute: "2-digit" });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { timeZone: DISPLAY_TZ, weekday: "long", month: "long", day: "numeric" });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);
</script>

</body>
</html>
