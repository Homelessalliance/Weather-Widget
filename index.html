<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  background: #0b1e3c;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

/* LEFT */
.weather {
  flex: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.city { font-size: 50px; }
.desc { font-size: 28px; margin-top: 8px; }

.current-row {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-top: 30px;
}

/* ✅ ICON IMAGE SIZE */
.current-icon img {
  width: 90px;
  height: 90px;
  filter: brightness(0) invert(1);
}

.temp {
  font-size: 160px;
  font-weight: bold;
}

.wind {
  margin-top: 10px;
  font-size: 26px;
}

/* FORECAST */
.forecast {
  display: flex;
  gap: 60px;
  margin-top: 70px;
}

.forecast-day {
  text-align: center;
  font-size: 28px;
  min-width: 110px;
  padding: 12px;
  border-radius: 12px;
}

.forecast-day.today {
  border: 2px solid #7fc8f8;
}

/* ✅ ICON SIZE IN FORECAST */
.icon img {
  width: 40px;
  height: 40px;
  filter: brightness(0) invert(1);
}

.rain {
  font-size: 22px;
  color: #7fc8f8;
}

/* RIGHT */
.side {
  flex: 1;
  background: #132f5e;
  display: flex;
  flex-direction: column;
  padding: 55px 40px 40px 40px;
}

.side-top {
  text-align: center;
  padding-top: 20px;
}

.clock { font-size: 64px; }
.date { font-size: 34px; }

.side-middle {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo { width: 250px; }

.notice { font-size: 32px; }
</style>
</head>

<body>

<div class="container">

<div class="weather">

<div class="city">Oklahoma City</div>
<div class="desc">Current Conditions</div>

<div class="current-row">
<div id="icon" class="current-icon"></div>
<div id="temp" class="temp">--°F</div>
</div>

<div id="wind" class="wind"></div>

<div id="forecast" class="forecast"></div>

</div>

<div class="side">

<div class="side-top">
<div id="clock" class="clock"></div>
<div id="date" class="date"></div>
</div>

<div class="side-middle">
<img src="logo.png" class="logo">
</div>

<div class="notice">
<div>Welcome to the Homeless Alliance</div>
<div style="margin-top:20px; color:#ffd166; font-weight:bold;">
Day Shelter Hours: 7:00 AM - 3:00 PM
</div>
</div>

</div>

</div>

<script>

/* ✅ USE YOUR LOCAL SVG FILES */
function getIconPath(code) {
  if (code === 0) return "Sun.svg";
  if (code <= 2) return "Cloud.svg";
  if (code === 3) return "Cloud.svg";

  if (code >= 51 && code <= 67) return "Rain.svg";
  if (code >= 71 && code <= 77) return "Snow.svg";
  if (code >= 95) return "Storm.svg";

  return "Default.svg";
}

async function loadWeather() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.4676&longitude=-97.5164&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&current_weather=true&timezone=auto"
    );

    const data = await res.json();

    const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);

    document.getElementById("temp").innerText = tempF + "°F";

    /* ✅ CURRENT ICON */
    document.getElementById("icon").innerHTML =
      `<img src="${getIconPath(data.current_weather.weathercodewind").innerText =
      "Wind: " + Math.round(data.current_weather.windspeed) + " mph";

    const today = new Date().toLocaleDateString("en-CA");
    let startIndex = data.daily.time.indexOf(today);
    if (startIndex < 0) startIndex = 0;

    let html = "";

    for (let i = startIndex; i < startIndex + 5; i++) {

      const code = data.daily.weathercode[i];
      const rain = data.daily.precipitation_probability_max[i];
      const high = Math.round((data.daily.temperature_2m_max[i] * 9/5) + 32);
      const low  = Math.round((data.daily.temperature_2m_min[i] * 9/5) + 32);

      const label = new Date(data.daily.time[i] + "T12:00:00")
        .toLocaleDateString([], { weekday: "short" });

      const className = (i === startIndex)
        ? "forecast-day today"
        : "forecast-day";

      html += `
        <div class="${className}">
          <div>${label}</div>
          <div class="icon">
            <img src="${getIconPath(code)} </div>
          <div>${high}° / ${low}°</div>
          <div class="rain">${rain}%</div>
        </div>
      `;
    }

    document.getElementById("forecast").innerHTML = html;

  } catch {
    document.getElementById("temp").innerText = "--°F";
  }
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  document.getElementById("date").innerText =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

loadWeather();
setInterval(loadWeather, 600000);

updateClock();
setInterval(updateClock, 60000);

</script>

</body>
</html>
``
